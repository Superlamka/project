
<ion-header>
  <ion-toolbar>
    <ion-title>Available work</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Browse published work</h2>

  <ion-list *ngIf="works$ | async as works">

    <ion-item *ngFor="let work of works">
      <ion-label class="ion-text-wrap">
        {{ work }}
      </ion-label>
    </ion-item>

    <ion-item *ngIf="works.length === 0">
      <ion-label color="medium">
        No work has been published yet.
      </ion-label>
    </ion-item>

  </ion-list>

</ion-content>
