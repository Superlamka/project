
<ion-header>
  <ion-toolbar>
    <ion-title>Available work</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Browse published work</h2>

  <ng-container *ngIf="works$ | async as works">

    <ion-list *ngIf="works.length === 0">

      <ion-item>
        <ion-label color="medium">
          No work has been published yet.
        </ion-label>
      </ion-item>

    </ion-list>

    <div *ngFor="let work of works">

      <app-work-card
        [work]="work"
        (responseSubmitted)="onResponseSubmitted(work.id, $event)">
      </app-work-card>

    </div>

  </ng-container>

</ion-content>
